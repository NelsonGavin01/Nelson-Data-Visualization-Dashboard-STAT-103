<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Statistics & Data Visualizer - Premium Edition</title>
    <script src="https://d3js.org/d3.v7.min.js"></script>
    <style>
        /* DARK MODE CORE VARIABLES */
        :root {
            --bg-page: #111827;       
            --bg-panel: #1f2937;      
            --bg-input: #374151;      
            --text-main: #f9fafb;     
            --text-muted: #9ca3af;    
            --border-color: #374151;  
            --accent-blue: #3b82f6;
            --accent-blue-hover: #60a5fa;
            --accent-orange: #f59e0b; 
        }

        body {
            font-family: system-ui, -apple-system, sans-serif;
            max-width: 900px;
            margin: 0 auto;
            padding: 20px;
            background-color: var(--bg-page);
            color: var(--text-main);
        }

        .container {
            background: var(--bg-panel);
            padding: 25px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }

        h2, h3, p {
            color: var(--text-main);
            margin-top: 0;
        }

        textarea {
            width: 100%;
            height: 80px;
            padding: 10px;
            margin-bottom: 10px;
            background-color: var(--bg-input);
            color: var(--text-main);
            border: 1px solid var(--border-color);
            border-radius: 4px;
            font-family: monospace;
            box-sizing: border-box;
            resize: vertical;
        }
        
        textarea:focus {
            outline: none;
            border-color: var(--accent-blue);
        }

        /* Standard Calculate Button */
        .calc-button {
            background-color: var(--accent-blue);
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
            font-size: 16px;
            transition: background-color 0.2s;
        }
        .calc-button:hover {
            background-color: var(--accent-blue-hover);
        }

        /* Physical-style Action Buttons for CSV */
        .action-button {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            padding: 12px 24px;
            font-size: 16px;
            font-weight: bold;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.1s ease;
            margin-bottom: 4px; 
        }
        
        .action-button:active {
            transform: translateY(4px);
            box-shadow: 0 0 0 rgba(0,0,0,0) !important;
        }

        .btn-upload { background-color: #059669; box-shadow: 0 4px 0 #064e3b; }
        .btn-upload:hover { background-color: #10b981; }

        .btn-download { background-color: #4b5563; box-shadow: 0 4px 0 #111827; }
        .btn-download:hover { background-color: #6b7280; }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(100px, 1fr));
            gap: 15px;
            margin: 20px 0;
            padding: 15px;
            background-color: var(--bg-page); 
            border: 1px solid var(--border-color);
            border-radius: 6px;
            align-items: center;
        }

        /* UPGRADED: Dynamic Interactive Stat Boxes */
        .stat-box {
            text-align: center;
            padding: 10px 0;
            border-radius: 6px;
            border: 1px solid transparent; 
            transition: all 0.2s ease-in-out;
            cursor: default;
        }
        .stat-label {
            font-size: 0.875rem;
            color: var(--text-muted);
            margin-bottom: 4px;
            transition: color 0.2s;
        }
        .stat-value {
            font-size: 1.25rem;
            font-weight: bold;
            color: var(--accent-blue-hover);
            transition: all 0.2s;
        }

        /* The Hover Effect */
        .stat-box:hover {
            background-color: rgba(59, 130, 246, 0.15); 
            border-color: var(--accent-blue);
            box-shadow: 0 4px 12px rgba(59, 130, 246, 0.3); 
            transform: translateY(-2px) scale(1.02); 
        }
        .stat-box:hover .stat-value { 
            color: #93c5fd; 
            font-size: 1.3rem; 
        }
        .stat-box:hover .stat-label { 
            color: var(--text-main); 
            font-weight: bold; 
        }

        /* Emphasized Median Styling */
        .median-highlight {
            border: 1px solid var(--accent-orange);
            background-color: rgba(245, 158, 11, 0.05);
        }
        .median-highlight .stat-value {
            color: var(--accent-orange);
        }

        .chart-container {
            margin-top: 30px;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            padding: 15px;
            background: var(--bg-page);
            position: relative; 
        }

        /* PREMIUM BIN SLIDER STYLING */
        .slider-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }
        input[type=range] {
            -webkit-appearance: none;
            width: 150px;
            background: transparent;
            margin-left: 10px;
            vertical-align: middle;
        }
        input[type=range]:focus {
            outline: none;
        }
        input[type=range]::-webkit-slider-runnable-track {
            width: 100%;
            height: 6px;
            cursor: pointer;
            background: #4b5563;
            border-radius: 3px;
        }
        input[type=range]::-webkit-slider-thumb {
            height: 18px;
            width: 18px;
            border-radius: 50%;
            background: var(--accent-blue);
            cursor: pointer;
            -webkit-appearance: none;
            margin-top: -6px;
            box-shadow: 0 0 8px rgba(59, 130, 246, 0.6);
            transition: transform 0.1s;
        }
        input[type=range]::-webkit-slider-thumb:hover {
            transform: scale(1.2);
            background: var(--accent-blue-hover);
        }

        /* DARK MODE D3.JS SVG STYLING */
        svg { width: 100%; height: auto; overflow: visible; }
        .domain, .tick line { stroke: #4b5563; }
        .tick text { fill: #9ca3af; font-family: system-ui, sans-serif; font-size: 11px; }

        /* Histogram Bars */
        .bar rect {
            fill: var(--accent-blue);
            opacity: 0.85; 
            cursor: pointer;
        }
        .bar rect:hover { opacity: 1; }
        .bar text {
            fill: var(--text-main);
            font-size: 12px;
            font-weight: bold;
            text-anchor: middle;
            pointer-events: none; 
        }

        /* Density Curve */
        .density-curve {
            fill: none;
            stroke: var(--accent-orange);
            stroke-width: 3px;
            stroke-linejoin: round;
            pointer-events: none; 
        }

        /* Boxplot Elements */
        .box { fill: #1e3a8a; stroke: var(--accent-blue-hover); stroke-width: 2px; }
        .whisker, .box-lines { stroke: var(--accent-blue-hover); stroke-width: 2px; }
        .median-line { stroke: var(--accent-orange); stroke-width: 4px; }
        
        /* Hover Tooltip Styling */
        .d3-tooltip {
            position: absolute;
            text-align: left;
            padding: 10px 14px;
            font-size: 13px;
            background: rgba(17, 24, 39, 0.95); 
            color: #fff;
            border: 1px solid var(--accent-blue);
            border-radius: 6px;
            pointer-events: none; 
            opacity: 0;
            z-index: 100;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
            transform: translate(-50%, -110%);
            line-height: 1.5;
            transition: opacity 0.2s ease;
        }
        .d3-tooltip strong { color: var(--accent-blue-hover); }
    </style>
</head>
<body>

<div class="container">
    <h2>Data Input (Study Hours)</h2>
    
    <div style="margin-bottom: 20px; display: flex; gap: 15px;">
        <input type="file" id="csvFileInput" accept=".csv" style="display: none;" onchange="handleFileUpload(event)">
        <button class="action-button btn-upload" onclick="document.getElementById('csvFileInput').click()">
            📁 Upload CSV
        </button>
        <button class="action-button btn-download" onclick="downloadCSV()">
            💾 Download CSV
        </button>
    </div>

    <p style="color: var(--text-muted); margin-bottom: 8px;">Enter a comma-separated list of numbers below:</p>
    <textarea id="dataInput">12, 15, 8, 10, 20, 25, 14, 18, 5, 30, 22, 16, 11, 9, 24, 19, 13, 17, 21, 28, 7, 26, 23, 27, 6, 29, 15, 12, 18, 20</textarea>
    <button class="calc-button" onclick="processData()">Calculate & Animate Charts</button>

    <div class="stats-grid" id="statsOutput"></div>

    <div class="chart-container" id="histogram">
        <div class="slider-header">
            <h3 style="margin: 0;">Histogram & Density Curve</h3>
            <div style="font-size: 14px; color: var(--text-muted);">
                <label for="binSlider">Bins: <span id="binCountDisplay" style="color: var(--text-main); font-weight: bold;">10</span></label>
                <input type="range" id="binSlider" min="5" max="30" value="10">
            </div>
        </div>
        <div id="histogramChart"></div>
    </div>
    
    <div class="chart-container" id="boxplot">
        <h3>Boxplot (Data Spread)</h3>
        <div id="boxplotChart"></div>
    </div>
</div>

<div id="tooltip" class="d3-tooltip"></div>

<script>
    const tooltip = d3.select("#tooltip");

    function getParsedData() {
        const inputRaw = document.getElementById('dataInput').value;
        return inputRaw.split(',')
            .map(d => parseFloat(d.trim()))
            .filter(d => !isNaN(d));
    }

    processData();

    document.getElementById('binSlider').addEventListener('input', function(e) {
        document.getElementById('binCountDisplay').innerText = e.target.value;
        const data = getParsedData();
        if(data.length > 0) {
            drawHistogram(data, parseInt(e.target.value), false); 
        }
    });

    function handleFileUpload(event) {
        const file = event.target.files[0];
        if (!file) return;

        const reader = new FileReader();
        reader.onload = function(e) {
            const text = e.target.result;
            const cleanedText = text.replace(/[\n\r]+/g, ',').replace(/,\s*,/g, ',');
            document.getElementById('dataInput').value = cleanedText;
            processData(); 
        };
        reader.readAsText(file);
        event.target.value = ''; 
    }

    // Function to Calculate Mode
    function calculateMode(data) {
        if (data.length === 0) return "None";
        const frequencyMap = {};
        let maxFreq = 0;
        let modes = [];

        data.forEach(val => {
            frequencyMap[val] = (frequencyMap[val] || 0) + 1;
            if (frequencyMap[val] > maxFreq) {
                maxFreq = frequencyMap[val];
            }
        });

        if (maxFreq === 1) return "None";

        for (const key in frequencyMap) {
            if (frequencyMap[key] === maxFreq) {
                modes.push(Number(key));
            }
        }
        return modes.join(', ');
    }

    function downloadCSV() {
        const data = getParsedData();
        if (data.length === 0) {
            alert("No valid data to download.");
            return;
        }

        const sorted = [...data].sort(d3.ascending);
        const stats = {
            "Count (n)": data.length,
            "Median": d3.median(data).toFixed(2),
            "Mean": d3.mean(data).toFixed(2),
            "Mode": calculateMode(data),
            "Range": (d3.max(data) - d3.min(data)).toFixed(2),
            "Sample Var": d3.variance(data) ? d3.variance(data).toFixed(2) : "0",
            "Std Dev": d3.deviation(data) ? d3.deviation(data).toFixed(2) : "0",
            "Min": d3.min(data),
            "Q1": d3.quantile(sorted, 0.25).toFixed(2),
            "Q3": d3.quantile(sorted, 0.75).toFixed(2),
            "Max": d3.max(data)
        };
        const statEntries = Object.entries(stats);

        const currentBins = parseInt(document.getElementById('binSlider').value);
        const x = d3.scaleLinear().domain([d3.min(data) - 2, d3.max(data) + 2]);
        const histogram = d3.bin().domain(x.domain()).thresholds(currentBins);
        const bins = histogram(data);

        let csvRows = [];
        csvRows.push("sep=,"); 

        let headers = ['"Raw Input"', '""', '"Statistic Category"', '"Statistic Value"', '""', '"Bin Range (Min to Max)"', '"Frequency Count"'];
        csvRows.push(headers.join(","));

        const maxRows = Math.max(data.length, statEntries.length, bins.length);

        for (let i = 0; i < maxRows; i++) {
            let colData     = i < data.length ? data[i] : "";
            let colStatName = i < statEntries.length ? statEntries[i][0] : "";
            let colStatVal  = i < statEntries.length ? statEntries[i][1] : "";
            let colBinRange = i < bins.length ? `${bins[i].x0} to ${bins[i].x1}` : "";
            let colBinFreq  = i < bins.length ? bins[i].length : "";

            let row = [
                `"${colData}"`, `""`, `"${colStatName}"`, `"${colStatVal}"`, `""`, `"${colBinRange}"`, `"${colBinFreq}"`
            ];
            csvRows.push(row.join(","));
        }

        const csvContent = "\uFEFF" + csvRows.join('\n');
        const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
        const url = URL.createObjectURL(blob);
        
        const link = document.createElement("a");
        link.setAttribute("href", url);
        link.setAttribute("download", "statistics_dashboard_export.csv");
        link.style.visibility = 'hidden';
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
    }

    function processData() {
        const data = getParsedData(); 
        if (data.length === 0) {
            alert("Please enter valid numerical data separated by commas.");
            return;
        }

        document.getElementById('binSlider').value = 10;
        document.getElementById('binCountDisplay').innerText = 10;

        calculateStats(data);
        drawHistogram(data, 10, true); 
        drawBoxplot(data, true);
    }

    function calculateStats(data) {
        const sorted = [...data].sort(d3.ascending);
        
        const stats = {
            "Count (n)": data.length,
            "Median": d3.median(data).toFixed(2),
            "Mean": d3.mean(data).toFixed(2),
            "Mode": calculateMode(data),
            "Range": (d3.max(data) - d3.min(data)).toFixed(2),
            "Sample Var": d3.variance(data) ? d3.variance(data).toFixed(2) : "0",
            "Std Dev": d3.deviation(data) ? d3.deviation(data).toFixed(2) : "0",
            "Min": d3.min(data),
            "Q1": d3.quantile(sorted, 0.25).toFixed(2),
            "Q3": d3.quantile(sorted, 0.75).toFixed(2),
            "Max": d3.max(data)
        };

        const html = Object.entries(stats).map(([label, value]) => `
            <div class="stat-box ${label === 'Median' ? 'median-highlight' : ''}">
                <div class="stat-label">${label}</div>
                <div class="stat-value">${value}</div>
            </div>
        `).join('');

        document.getElementById('statsOutput').innerHTML = html;
    }

    function kernelDensityEstimator(kernel, X) {
        return function(V) { return X.map(x => [x, d3.mean(V, v => kernel(x - v))]); };
    }
    function kernelEpanechnikov(k) {
        return function(v) { return Math.abs(v /= k) <= 1 ? 0.75 * (1 - v * v) / k : 0; };
    }

    function drawHistogram(data, binsCount = 10, animate = false) {
        d3.select("#histogramChart svg").remove();

        const margin = {top: 20, right: 30, bottom: 40, left: 40},
              width = 800 - margin.left - margin.right,
              height = 300 - margin.top - margin.bottom;

        const svg = d3.select("#histogramChart")
          .append("svg")
            .attr("viewBox", `0 0 ${width + margin.left + margin.right} ${height + margin.top + margin.bottom}`)
          .append("g")
            .attr("transform", `translate(${margin.left},${margin.top})`);

        const x = d3.scaleLinear()
            .domain([d3.min(data) - 2, d3.max(data) + 2])
            .range([0, width]);

        svg.append("g")
            .attr("transform", `translate(0,${height})`)
            .call(d3.axisBottom(x));

        const histogram = d3.bin().domain(x.domain()).thresholds(binsCount);
        const bins = histogram(data);

        const std = d3.deviation(data) || 1;
        const bandwidth = 1.06 * std * Math.pow(data.length, -0.2);
        const kde = kernelDensityEstimator(kernelEpanechnikov(bandwidth), x.ticks(50));
        const density = kde(data);

        const binWidth = bins.length > 0 ? (bins[0].x1 - bins[0].x0) : 1;
        const scaleFactor = data.length * binWidth;

        const maxBinFreq = d3.max(bins, d => d.length);
        const maxDensityFreq = d3.max(density, d => d[1] * scaleFactor) || 0;
        
        const y = d3.scaleLinear()
            .range([height, 0])
            .domain([0, Math.max(maxBinFreq, maxDensityFreq) + 1]);

        svg.append("g").call(d3.axisLeft(y).ticks(5));

        const barGroups = svg.selectAll(".bar")
            .data(bins)
            .join("g")
            .attr("class", "bar")
            .attr("transform", d => `translate(${x(d.x0)},${y(d.length)})`);

        const rects = barGroups.append("rect")
            .attr("x", 1)
            .attr("width", d => Math.max(0, x(d.x1) - x(d.x0) - 1))
            .on("mouseover", function(event, d) {
                d3.select(this).style("fill", "var(--accent-blue-hover)");
                tooltip.style("opacity", 1)
                       .html(`Range: <strong>${d.x0.toFixed(1)} to ${d.x1.toFixed(1)}</strong><br/>Frequency: <strong>${d.length}</strong>`)
                       .style("left", (event.pageX) + "px")
                       .style("top", (event.pageY) + "px");
            })
            .on("mousemove", function(event) {
                tooltip.style("left", (event.pageX) + "px").style("top", (event.pageY) + "px");
            })
            .on("mouseout", function() {
                d3.select(this).style("fill", "var(--accent-blue)");
                tooltip.style("opacity", 0);
            });

        const labels = barGroups.append("text")
            .attr("dy", ".75em")
            .attr("y", -15)
            .attr("x", d => (x(d.x1) - x(d.x0)) / 2)
            .text(d => d.length > 0 ? d.length : "");

        if (animate) {
            rects.attr("height", 0)
                 .attr("y", d => height - y(d.length)) 
                 .transition().duration(800).ease(d3.easeCubicOut)
                 .attr("height", d => height - y(d.length))
                 .attr("y", 0); 
        } else {
            rects.attr("height", d => height - y(d.length)).attr("y", 0);
        }

        const path = svg.append("path")
            .datum(density)
            .attr("class", "density-curve")
            .attr("d", d3.line().curve(d3.curveBasis).x(d => x(d[0])).y(d => y(d[1] * scaleFactor)));

        if (animate) {
            const totalLength = path.node().getTotalLength();
            path.attr("stroke-dasharray", totalLength + " " + totalLength)
                .attr("stroke-dashoffset", totalLength)
                .transition().duration(1200).ease(d3.easeCubicInOut)
                .attr("stroke-dashoffset", 0);
        }
    }

    function drawBoxplot(data, animate = false) {
        d3.select("#boxplotChart svg").remove();

        const margin = {top: 20, right: 30, bottom: 40, left: 40},
              width = 800 - margin.left - margin.right,
              height = 150 - margin.top - margin.bottom;

        const svg = d3.select("#boxplotChart")
          .append("svg")
            .attr("viewBox", `0 0 ${width + margin.left + margin.right} ${height + margin.top + margin.bottom}`)
          .append("g")
            .attr("transform", `translate(${margin.left},${margin.top})`);

        const sorted = [...data].sort(d3.ascending);
        const q1 = d3.quantile(sorted, 0.25);
        const median = d3.median(sorted);
        const q3 = d3.quantile(sorted, 0.75);
        const min = d3.min(data);
        const max = d3.max(data);

        const x = d3.scaleLinear().domain([min - 2, max + 2]).range([0, width]);
        svg.append("g").attr("transform", `translate(0,${height})`).call(d3.axisBottom(x));

        const center = height / 2;
        const boxHeight = 40;

        const whiskerLine = svg.append("line")
            .attr("class", "whisker")
            .attr("y1", center).attr("y2", center);

        const iqrBox = svg.append("rect")
            .attr("class", "box")
            .attr("y", center - boxHeight/2)
            .attr("height", boxHeight);

        const ends = [min, max];
        const vertLines = svg.selectAll(".box-lines")
            .data(ends)
            .join("line")
            .attr("class", "box-lines")
            .attr("y1", center - boxHeight/2)
            .attr("y2", center + boxHeight/2);
            
        const medianLine = svg.append("line")
            .attr("class", "median-line")
            .attr("y1", center - boxHeight/2)
            .attr("y2", center + boxHeight/2);

        svg.append("rect")
            .attr("x", x(min) - 10)
            .attr("y", center - boxHeight)
            .attr("width", x(max) - x(min) + 20)
            .attr("height", boxHeight * 2)
            .attr("fill", "transparent")
            .style("cursor", "crosshair")
            .on("mouseover", function(event) {
                tooltip.style("opacity", 1)
                       .html(`
                        Max: <strong>${max.toFixed(2)}</strong><br/>
                        Q3: <strong>${q3.toFixed(2)}</strong><br/>
                        Median: <strong>${median.toFixed(2)}</strong><br/>
                        Q1: <strong>${q1.toFixed(2)}</strong><br/>
                        Min: <strong>${min.toFixed(2)}</strong>
                       `)
                       .style("left", (event.pageX) + "px")
                       .style("top", (event.pageY) + "px");
            })
            .on("mousemove", function(event) {
                tooltip.style("left", (event.pageX) + "px").style("top", (event.pageY) + "px");
            })
            .on("mouseout", function() { tooltip.style("opacity", 0); });

        if (animate) {
            whiskerLine.attr("x1", x(median)).attr("x2", x(median))
                .transition().duration(800).ease(d3.easeCubicOut)
                .attr("x1", x(min)).attr("x2", x(max));

            iqrBox.attr("x", x(median)).attr("width", 0)
                .transition().duration(800).ease(d3.easeCubicOut)
                .attr("x", x(q1)).attr("width", x(q3) - x(q1));

            vertLines.attr("x1", x(median)).attr("x2", x(median))
                .transition().duration(800).ease(d3.easeCubicOut)
                .attr("x1", d => x(d)).attr("x2", d => x(d));
                
            medianLine.attr("x1", x(median)).attr("x2", x(median))
                .transition().duration(800).ease(d3.easeCubicOut)
                .attr("x1", x(median)).attr("x2", x(median));
                
        } else {
            whiskerLine.attr("x1", x(min)).attr("x2", x(max));
            iqrBox.attr("x", x(q1)).attr("width", x(q3) - x(q1));
            vertLines.attr("x1", d => x(d)).attr("x2", d => x(d));
            medianLine.attr("x1", x(median)).attr("x2", x(median));
        }
    }
</script>

</body>
</html>
